
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY to confirm infrastructure deletion"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Destroy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require explicit confirmation
        working-directory: .
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DESTROY" ]]; then
            echo "You must type DESTROY exactly."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MernLearningTerraformDestroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verify ECR configuration
        run: |
          pwd
          grep -R -n "force_delete" .

      - name: Verify Terraform version
        run: terraform version

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan
