
name: Deploy MERN Application

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "The 40-character commit SHA whose images should be deployed"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2 through SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Validate commit SHA
        env:
          IMAGE_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A valid 40-character commit SHA is required."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MernLearningSSMDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify EC2 SSM connectivity
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [[ -z "$INSTANCE_ID" ]]; then
            echo "GitHub variable EC2_INSTANCE_ID is missing."
            exit 1
          fi

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text

      - name: Send deployment command
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_SHA: ${{ inputs.commit_sha }}
        run: |
          jq --arg sha "$IMAGE_SHA" \
            '.commands |= map(gsub("COMMIT_SHA"; $sha))' \
            deployment/ssm/deploy-commands.json \
            > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MERN application ${IMAGE_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${COMMAND_ID}"

      - name: Wait for deployment command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          for attempt in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
